<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ClipWithRin — AI Video Clipper</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#090909;
    color:white;
    min-height:100vh;
}

nav{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    border-bottom:1px solid #222;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.logo span{
    color:#e3fc87;
}

.hero{
    text-align:center;
    padding:60px 20px 30px;
}

.hero h1{
    font-size:clamp(30px,8vw,52px);
}

.hero span{
    color:#e3fc87;
}

.hero p{
    color:#999;
    margin-top:15px;
    line-height:1.6;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.upload-box{
    border:2px dashed #444;
    border-radius:20px;
    padding:45px 20px;
    text-align:center;
    background:#111;
}

.upload-box h2{
    margin:15px 0;
}

.upload-box p{
    color:#888;
    margin-bottom:25px;
}

.upload-btn{
    display:inline-block;
    background:#e3fc87;
    color:#000;
    padding:15px 28px;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
}

input[type=file]{
    display:none;
}

.editor{
    display:none;
    margin-top:30px;
    background:#111;
    border:1px solid #222;
    border-radius:20px;
    padding:20px;
}

.editor h2{
    margin-bottom:20px;
}

video{
    width:100%;
    max-height:500px;
    border-radius:15px;
    background:#000;
}

.info{
    margin-top:15px;
    color:#aaa;
}

.controls{
    margin-top:20px;
    padding:20px;
    background:#181818;
    border-radius:15px;
}

.controls label{
    display:block;
    margin:15px 0 8px;
    color:#ddd;
}

.controls input{
    width:100%;
}

.time{
    color:#e3fc87;
    margin-top:10px;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
    flex-wrap:wrap;
}

button{
    border:none;
    padding:13px 18px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.primary{
    background:#e3fc87;
    color:black;
}

.secondary{
    background:#333;
    color:white;
}

.feature-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:15px;
    margin-top:25px;
}

.feature{
    padding:18px;
    background:#181818;
    border-radius:12px;
}

.feature h3{
    color:#e3fc87;
    font-size:16px;
    margin-bottom:8px;
}

.feature p{
    color:#888;
    font-size:13px;
    line-height:1.5;
}

footer{
    text-align:center;
    color:#555;
    padding:40px 20px;
}
</style>
</head>

<body>

<nav>
    <div class="logo">
        CLIP<span>WITHRIN</span>
    </div>

    <div>My Projects</div>
</nav>

<section class="hero">
    <h1>
        Turn Long Videos Into
        <span>Short Clips.</span>
    </h1>

    <p>
        Upload a video and start creating your content.
    </p>
</section>

<div class="container">

    <div class="upload-box">

        <div style="font-size:50px;">🎬</div>

        <h2>Upload Your Video</h2>

        <p>MP4 • MOV • WEBM</p>

        <label class="upload-btn">
            Choose Video
            <input
                type="file"
                id="videoUpload"
                accept="video/*">
        </label>

    </div>


    <div class="editor" id="editor">

        <h2>🎬 Video Editor</h2>

        <video id="videoPreview" controls></video>

        <div class="info" id="videoInfo"></div>


        <div class="controls">

            <label>Start Clip</label>

            <input
                type="range"
                id="startRange"
                min="0"
                value="0"
                step="0.1">

            <div class="time">
                Start: <span id="startTime">0.0</span>s
            </div>


            <label>End Clip</label>

            <input
                type="range"
                id="endRange"
                min="0"
                value="0"
                step="0.1">

            <div class="time">
                End: <span id="endTime">0.0</span>s
            </div>


            <div class="buttons">

                <button class="primary" onclick="previewClip()">
                    ▶ Preview Clip
                </button>

                <button class="secondary" onclick="resetVideo()">
                    ↺ Change Video
                </button>

            </div>

        </div>


        <div class="feature-grid">

            <div class="feature">
                <h3>💬 Auto Caption</h3>
                <p>Coming next</p>
            </div>

            <div class="feature">
                <h3>🌐 Translate</h3>
                <p>Coming next</p>
            </div>

            <div class="feature">
                <h3>✂ Smart Clip</h3>
                <p>Coming next</p>
            </div>

        </div>

    </div>

</div>

<footer>
© 2026 ClipWithRin
</footer>


<script>

const upload = document.getElementById("videoUpload");
const video = document.getElementById("videoPreview");
const editor = document.getElementById("editor");

const startRange = document.getElementById("startRange");
const endRange = document.getElementById("endRange");

const startTime = document.getElementById("startTime");
const endTime = document.getElementById("endTime");

upload.addEventListener("change", function(){

    const file = this.files[0];

    if(!file) return;

    const url = URL.createObjectURL(file);

    video.src = url;

    editor.style.display = "block";

    document.getElementById("videoInfo").innerHTML =
        "📁 " + file.name;

    editor.scrollIntoView({
        behavior:"smooth"
    });

});


video.addEventListener("loadedmetadata", function(){

    const duration = video.duration;

    startRange.max = duration;
    endRange.max = duration;

    endRange.value = duration;

    endTime.textContent = duration.toFixed(1);

});


startRange.addEventListener("input", function(){

    startTime.textContent =
        Number(this.value).toFixed(1);

});


endRange.addEventListener("input", function(){

    endTime.textContent =
        Number(this.value).toFixed(1);

});


function previewClip(){

    video.currentTime =
        Number(startRange.value);

    video.play();

    const end =
        Number(endRange.value);

    const interval = setInterval(function(){

        if(video.currentTime >= end){

            video.pause();

            clearInterval(interval);

        }

    },100);

}


function resetVideo(){

    video.pause();

    video.src = "";

    upload.value = "";

    editor.style.display = "none";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

</script>

</body>
</html>
